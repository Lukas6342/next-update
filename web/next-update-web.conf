# /etc/next-update-web/config  (systemd EnvironmentFile: KEY=value, no spaces around =)

LISTEN=0.0.0.0
PORT=8080

# Login for the web UI. All three values must be set, the service refuses to start otherwise.
ADMIN_USER=
ADMIN_PASSWORD=

# Shared token the next-update-server daemons use (TOKEN in their config).
TOKEN=
