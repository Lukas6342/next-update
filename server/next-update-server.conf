# /etc/next-update-server/config  (sourced as bash, root only)

# Debian mode: use apt instead of pacman/AUR (pending list, selective updates, default commands).
# Docker updates work the same in both modes.
DEBIAN_MODE=no

# Run updates every time the daemon starts (i.e. on boot): yes / no
RUN_ON_BOOT=no

# Scheduled run: time of day (HH:MM, 24h, server local time). Empty = no schedule.
UPDATE_TIME="04:00"

# Days of the schedule: all, or comma separated: mon,tue,wed,thu,fri,sat,sun
UPDATE_DAYS="all"

# Abort the run at the first failing command: yes / no
STOP_ON_ERROR=no

# Packages that are never updated on this server (see NU_IGNORE below).
HOLD_PKGS=()

# Commands for "Update all" / boot / schedule, executed in order, each via `bash -c`.
# Leave unset to use the built-in default:
#   Arch   (DEBIAN_MODE=no): pacman -Syu --noconfirm ${NU_IGNORE:+--ignore "$NU_IGNORE"}
#   Debian (DEBIAN_MODE=yes): apt-get update ; apt-get -y upgrade (non-interactive, keeps your config files)
# NU_IGNORE = comma separated list of held packages (HOLD_PKGS + holds from the web UI).
# On Debian the held packages are put on `apt-mark hold` during the run automatically.
#COMMANDS=(
#    'pacman -Syu --noconfirm ${NU_IGNORE:+--ignore "$NU_IGNORE"}'
#    'systemctl reboot'
#)

# --- Web UI (optional, see next-update-web) ---
# On the same machine as next-update-web use: http://127.0.0.1:8080 (or http://localhost:8080)
# On a remote machine use: http://<ip-of-web-host>:8080
#WEB_URL="http://127.0.0.1:8080"
#TOKEN=""                # same value as TOKEN in /etc/next-update-web/config
#HOST_NAME=""            # name in the UI, leave empty to use system hostname automatically
#POLL_INTERVAL=10       # seconds between polls of the web ui
#CHECK_INTERVAL=900     # seconds between pacman/apt/AUR "pending updates" checks

# AUR updates (yay, Arch only): user that runs yay/makepkg (they refuse to run as root).
# That user needs passwordless sudo for pacman. Empty = no AUR.
#AUR_USER=""

# Docker image updates: compares the registry digest with the local image for every
# image used by a container. Docker Hub limits anonymous requests, so keep the interval long.
#DOCKER_CHECK=yes
#DOCKER_CHECK_INTERVAL=21600
