# /etc/next-update/config  (sourced as bash, root only)

# Run updates every time the daemon starts (i.e. on boot): yes / no
RUN_ON_BOOT=yes

# Scheduled run: time of day (HH:MM, 24h, server local time). Empty = no schedule.
UPDATE_TIME="04:00"

# Days of the schedule: all, or comma separated: mon,tue,wed,thu,fri,sat,sun
UPDATE_DAYS="all"

# Abort the run at the first failing command: yes / no
STOP_ON_ERROR=no

# Packages that are never updated on this server (see NU_IGNORE below).
HOLD_PKGS=()

# Commands, executed in order, each via `bash -c`.
# NU_IGNORE = comma separated list of held packages (local HOLD_PKGS + holds from the web UI).
COMMANDS=(
    'pacman -Syu --noconfirm ${NU_IGNORE:+--ignore "$NU_IGNORE"}'
)
# Reboot after updating: add "systemctl reboot" as last command.

# --- Central web server (optional, see next-update-server) ---
#SERVER_URL="http://192.168.1.10:8080"
#SERVER_TOKEN=""
#HOST_NAME="$HOSTNAME"
#POLL_INTERVAL=10       # seconds between server polls
#CHECK_INTERVAL=900     # seconds between pacman/AUR "pending updates" checks

# AUR updates (yay): user that runs yay/makepkg (they refuse to run as root).
# That user needs passwordless sudo for pacman. Empty = no AUR.
#AUR_USER=""

# Docker image updates: compares the registry digest with the local image for every
# image used by a container. Docker Hub limits anonymous requests, so keep the interval long.
#DOCKER_CHECK=yes
#DOCKER_CHECK_INTERVAL=21600
